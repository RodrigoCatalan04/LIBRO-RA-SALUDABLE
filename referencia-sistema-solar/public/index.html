<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Libro del sistema solar con RA</title>

  <link rel="stylesheet" href="css/estilos.css">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <script src="js/orbita.js"></script>
  <script src="js/sistema.js"></script>
  <script src="js/libro.js" defer></script>
</head>

<body>
  <section id="panel" aria-label="Controles del libro">
    <label for="pagina">Página del libro</label>

    <select id="pagina">
      <option value="1">1 El Sol</option>
      <option value="2">2 Planetas rocosos</option>
      <option value="3">3 Planetas gigantes</option>
      <option value="4">4 Rotación y traslación</option>
      <option value="5">5 El sistema completo</option>
    </select>

    <p id="contenido"></p>

    <button id="pausa" type="button">Pausar</button>

    <p id="estado" role="status">
      Permite la cámara y enfoca Hiro.
    </p>

    <small>Modelo didáctico sin escala real.</small>
  </section>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker
      id="marcador"
      preset="hiro"
      emitevents="true">

      <a-entity
        id="sistema"
        sistema-solar
        position="0 0.15 0"
        scale="0.22 0.22 0.22">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
