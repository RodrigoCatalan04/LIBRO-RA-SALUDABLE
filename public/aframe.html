<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera escena de alimentación saludable</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
  <!-- Primera escena 3D. Todavia no usa la camara del dispositivo. -->
  <a-scene background="color: #0d1f2a" vr-mode-ui="enabled: false">

    <!-- Plato inclinado hacia la camara: base blanca y sus tres porciones.
         theta-start y theta-length recortan el circulo en grados. -->
    <a-entity position="-1.4 1.5 -4" rotation="55 0 0">
      <a-cylinder radius="0.78" height="0.04" color="#f4f6f8"
        material="shader: flat"></a-cylinder>

      <a-circle radius="0.72" position="0 0.03 0" rotation="-90 0 0"
        theta-start="0" theta-length="180" color="#3f9b4f"
        material="shader: flat; side: double"></a-circle>

      <a-circle radius="0.72" position="0 0.03 0" rotation="-90 0 0"
        theta-start="180" theta-length="90" color="#d2a661"
        material="shader: flat; side: double"></a-circle>

      <a-circle radius="0.72" position="0 0.03 0" rotation="-90 0 0"
        theta-start="270" theta-length="90" color="#b5654a"
        material="shader: flat; side: double"></a-circle>
    </a-entity>

    <!-- Manzana que gira sobre su propio eje. -->
    <a-entity position="0.9 1.5 -4"
      animation="property: rotation; to: 0 360 0;
      dur: 6000; loop: true; easing: linear">

      <a-sphere radius="0.4" color="#d64545"
        material="shader: flat"></a-sphere>

      <a-cylinder radius="0.04" height="0.25" position="0 0.45 0"
        color="#6b4b2a" material="shader: flat"></a-cylinder>

      <a-box width="0.3" height="0.03" depth="0.16"
        position="0.16 0.52 0" rotation="0 0 20"
        color="#4f9b45" material="shader: flat"></a-box>

      <!-- Marca visual para percibir el giro. -->
      <a-sphere position="0 0 0.39" radius="0.07" color="#f5e663"
        material="shader: flat"></a-sphere>
    </a-entity>

    <a-entity camera position="0 1.6 0" look-controls></a-entity>
  </a-scene>
</body>
</html>
