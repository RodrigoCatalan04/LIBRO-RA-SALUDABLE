<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Libro de alimentación saludable con RA</title>

  <link rel="stylesheet" href="css/estilos.css">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <script src="js/orbita.js"></script>
  <script src="js/sistema.js"></script>
  <script src="js/libro.js" defer></script>
</head>

<body>
  <section id="panel" aria-label="Controles del libro">
    <h1>Alimentación saludable en RA</h1>

    <label for="pagina">Página del libro</label>

    <select id="pagina">
      <option value="1">1 El plato saludable</option>
      <option value="2">2 Grupos de alimentos y nutrientes</option>
      <option value="3">3 Ultraprocesados y octógonos</option>
      <option value="4">4 Agua y movimiento</option>
      <option value="5">5 Mi plato completo</option>
    </select>

    <p id="contenido"></p>

    <button id="pausa" type="button">Pausar</button>

    <p id="estado" role="status">
      Permite la cámara y enfoca el marcador Hiro.
    </p>

    <!--
      Ampliación multimedia (Paso 12 de la guía).
      Graba tu narración y tu video, guárdalos como assets/narracion.mp3 y
      assets/explicacion.mp4, y descomenta este bloque. Los archivos no vienen
      incluidos en el proyecto.

    <audio controls preload="none" src="assets/narracion.mp3"></audio>
    <video controls playsinline preload="metadata"
      src="assets/explicacion.mp4" style="width:100%"></video>
    -->

    <small>Modelo didáctico: las figuras no representan porciones reales.</small>
  </section>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker
      id="marcador"
      preset="hiro"
      emitevents="true">

      <a-entity
        id="plato"
        plato-saludable
        position="0 0.15 0"
        scale="0.19 0.19 0.19">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
